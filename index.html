<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cumpleaños Gamer | Reymundō Jr.</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CONTENEDOR GLOBAL RESPONSIVO -->
    <div class="invitacion-wrapper">
        
        <!-- PANTALLA DE ENTRADA (PRIMERA.JPG + 1 BOTÓN DE IMPACTO) -->
        <div id="pantalla-entrada" class="pantalla-entrada">
            <img src="img/primera.jpg" class="img-base" alt="Fondo Gamer Inicial">
            
            <div class="capa-interactiva">
                <button id="btn-empezar" class="btn-gamer-pro btn-empezar-pro">
                    <div class="glow-effect"></div>
                    <svg class="svg-icon" viewBox="0 0 24 24" width="22" height="22">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <span class="btn-texto">EMPEZAR PARTIDA</span>
                    <span class="btn-flechas">&gt;&gt;</span>
                </button>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL (SEGUNDA.JPG + 2 BOTONES LADO A LADO) -->
        <main id="contenido-invitacion" class="contenido-invitacion">
            <div class="seccion-img">
                <img src="img/segunda.jpg" class="img-base" alt="Fondo Detalles Gamer">
                
                <!-- BOTONES LADO A LADO EN SEGUNDA -->
                <div class="contenedor-botones-duales">
                    <!-- BOTÓN UBICACIÓN -->
                    <a href="https://maps.app.goo.gl/nkZHzKtPyPjhpGo6A" target="_blank" class="btn-gamer-pro btn-dual">
                        <div class="glow-effect"></div>
                        <svg class="svg-icon" viewBox="0 0 24 24" width="18" height="18">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                        <span class="btn-texto">UBICACIÓN</span>
                        <span class="btn-flechas">&gt;&gt;</span>
                    </a>
                    
                    <!-- BOTÓN CONFIRMAR -->
                    <a href="https://wa.me/12544447098?text=%C2%A1Hola!%20Confirmo%20mi%20asistencia%20al%20cumplea%C3%B1os%20de%20Reymundo%20Jr." target="_blank" class="btn-gamer-pro btn-dual">
                        <div class="glow-effect"></div>
                        <svg class="svg-icon" viewBox="0 0 24 24" width="18" height="18">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                        <span class="btn-texto">CONFIRMAR</span>
                        <span class="btn-flechas">&gt;&gt;</span>
                    </a>
                </div>
            </div>

            <!-- MÚSICA GAMER EPICA/CYBERPUNK DE FONDO -->
            <audio id="audio-fondo" src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" loop></audio>
        </main>

    </div>

    <script src="main.js"></script>
</body>
</html>
